name: Presentation integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check validator contracts
        run: python Tools/check_presentation.py --self-test
      - name: Check curated entry pages and local links
        run: python Tools/check_presentation.py
      - name: Check actual change whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git show --format= --check "$HEAD_SHA"
          fi
      # No external-link requests, Unity/Player, GPU dispatch, or performance runs.
