name: CPU functional contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  functional:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explicit CPU-only assertions and source contracts
        shell: pwsh
        run: ./Tools/Run-FunctionalChecks.ps1
      # No Unity/Player, GPU dispatch, profiling, allocation counters, performance
      # framework, benchmark enumeration, autotuning, or upstream executable runs.
